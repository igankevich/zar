---
name: CI
on: [push]
jobs:
  ubuntu-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/igankevich/zar-ci:latest
    env:
      TZ: Europe/Berlin
      RUST_BACKTRACE: 1
      SIMILAR_ASSERTS_MAX_STRING_LENGTH: 0
      ARBTEST_BUDGET_MS: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Lint
        run: ./ci/lint.sh
      - name: Test
        run: ./ci/test.sh
  macos-tests:
    runs-on: macos-latest
    env:
      TZ: Europe/Berlin
      RUST_BACKTRACE: 1
      ARBTEST_BUDGET_MS: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --quiet --no-fail-fast --workspace --all-targets -- --nocapture
  windows-tests:
    runs-on: windows-latest
    env:
      TZ: Europe/Berlin
      RUST_BACKTRACE: 1
      ARBTEST_BUDGET_MS: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --quiet --no-fail-fast --workspace --all-targets -- --nocapture
  linux-binaries:
    needs: [ubuntu-tests]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/igankevich/zar-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Build static binaries
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-archives
          path: zar-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  macos-binaries:
    needs: [macos-tests]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Build binaries
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-archives
          path: zar-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  windows-binaries:
    needs: [windows-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Init
        shell: bash
        run: ./ci/init.sh
      - name: Build binaries
        shell: bash
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-archives
          path: zar-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  publish-binaries:
    needs: [linux-binaries, macos-binaries, windows-binaries]
    # TODO
    # if: github.ref_type == 'tag'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/igankevich/zar-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Download Linux binaries
        uses: actions/download-artifact@v5
        with:
          name: linux-archives
      - name: Download MacOS binaries
        uses: actions/download-artifact@v5
        with:
          name: macos-archives
      - name: Download Windows binaries
        uses: actions/download-artifact@v5
        with:
          name: windows-archives
      - name: Create release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          # TODO
          draft: true
          prerelease: false
      - name: Upload Linux binaries
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: zar-Linux-x86_64-${{ env.VERSION }}.tar.gz
          asset_name: zar-Linux-x86_64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload MacOS binaries
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: zar-Darwin-aarch64-${{ env.VERSION }}.tar.gz
          asset_name: zar-Darwin-aarch64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload Windows binaries
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: zar-Windows-x86_64-${{ env.VERSION }}.tar.gz
          asset_name: zar-Windows-x86_64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
